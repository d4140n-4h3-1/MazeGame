[package]
name = "maze"
version = "0.1.0"
edition = "2021"
description = "A small first-person maze game on Fyrox, rendered with Vulkan."
license = "MIT AND CC-BY-SA-4.0"

# A workspace of its own, like iapetus-vulkan: Cargo features add up across a workspace, and the
# engine picks OpenGL whenever anything enables it.
[workspace]

[dependencies]
# The engine's wgpu backend only. On Linux wgpu drives Vulkan.
fyrox = { git = "https://github.com/d4140n-4h3-1/Fyrox.git", branch = "vulkan", default-features = false, features = ["backend_wgpu"] }
# Only used to confirm at startup which graphics API the renderer actually got.
fyrox-graphics-wgpu = { git = "https://github.com/d4140n-4h3-1/Fyrox.git", branch = "vulkan" }
wgpu = "30"
# Reading where the droid's skids take it, from the file made along with its animations.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Refractive glass and other graphics improvements kept outside the engine.
fyrox-gfx = { git = "https://github.com/d4140n-4h3-1/fyrox-gfx.git", branch = "main", features = ["raytracing"] }

# Optimized engine, debuggable game code. The engine's own debug assertions and overflow checks
# cost more than they are worth here: with them on, a `cargo run` build spends about four times
# longer per frame than a release build.
# The web version, built by web/build.sh: optimized across crates, which makes the download
# smaller and the game faster, at the cost of a slower build.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
# In a browser wgpu draws with WebGL 2, which it leaves out unless asked.
wgpu = { version = "30", features = ["webgl"] }
# Asking whether the browser has locked the mouse to the page, reloading it to quit, and reading
# settings from its address.
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "UrlSearchParams", "Window"] }
