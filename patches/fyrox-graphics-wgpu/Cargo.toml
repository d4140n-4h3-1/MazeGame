# A copy of the engine fork's fyrox-graphics-wgpu at b463456, with two changes:
# - in a browser, the depth copy (src/depth_copy.rs) reads the G-buffer's depth through a sampler
#   that does not filter. Without it WebGL reads every depth as 0, so distant lamps light nothing
#   and the glass is never drawn;
# - a ray traced scene (src/raytracing.rs) holds what moves as well as what stands still, the
#   first given again every frame with set_moving_geometry, which fyrox-gfx uses so that droids'
#   shadows follow them.
# Cargo.toml's [patch] builds with this copy; drop both once the fork has these.
[package]
name = "fyrox-graphics-wgpu"
version = "2.0.0-rc.1"
edition = "2021"
license = "MIT"
description = "Wgpu-based graphics server for Fyrox Game Engine"
keywords = ["graphics", "gapi"]
categories = ["graphics", "rendering::graphics-api"]
include = ["/src/**/*", "/Cargo.toml", "/LICENSE", "/README.md"]
homepage = "https://fyrox.rs"
documentation = "https://docs.rs/fyrox-graphics-wgpu"
repository = "https://github.com/FyroxEngine/Fyrox"
rust-version = "1.87"

[dependencies]
winit = { version = "0.30" }
fyrox-graphics = { git = "https://github.com/d4140n-4h3-1/Fyrox.git", branch = "vulkan" }
fyrox-core = { git = "https://github.com/d4140n-4h3-1/Fyrox.git", branch = "vulkan" }
wgpu = { version = "30.0.0" }
# Uniform and vertex data for the ray tracing pass is written as plain bytes.
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = "0.6"
